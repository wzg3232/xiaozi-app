services:
  ichat:
    build: .
    environment:
      HOST: 0.0.0.0
      PORT: 4200
      DB_PATH: /app/data/ichat.sqlite
      ICHAT_DEMO: "0"
    ports:
      - "127.0.0.1:4220:4200"
    volumes:
      - ichat-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4200/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  ichat-data:
